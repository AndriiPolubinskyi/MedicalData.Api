events {}
http {
    include       mime.types;
    default_type  application/octet-stream;

    # Blazor WASM
    map $uri $wasm_type {
        ~\.wasm$  application/wasm;
        default   "";
    }

    gzip            on;
    gzip_types      text/css application/javascript application/json application/wasm;
    gzip_min_length 1024;
    sendfile        on;

    server {
        listen 80;
        server_name localhost;

        location ~* \.wasm$ {
            root /usr/share/nginx/html;
            add_header Content-Type application/wasm;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Blazor fingerprinted assets (_framework/) — safe to cache immutably
        location ~* ^/_framework/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Non-fingerprinted static assets — revalidate, not immutable
        location ~* \.(js|css|ico|png|svg|woff2?)$ {
            root /usr/share/nginx/html;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
            try_files $uri =404;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
