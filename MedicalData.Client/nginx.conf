events {}
http {
    include       mime.types;
    default_type  application/octet-stream;

    # Blazor WASM compressed files
    types {
        application/wasm                          wasm;
        application/octet-stream                  blat dat;
    }

    gzip            on;
    gzip_types      text/css application/javascript application/json application/wasm;
    gzip_min_length 1024;
    sendfile        on;

    server {
        listen 80;
        server_name localhost;

        # Cache static assets aggressively (Blazor fingerprints them)
        location ~* \.(js|css|wasm|blat|dat|ico|png|svg|woff2?)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
